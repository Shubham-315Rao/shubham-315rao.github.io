<script>
  // An invite link carries the friend's code: .../caramelcrushers/?code=K7M2Q9XA
  // Android: straight to Google Play, with the code in the install referrer, so the game
  //   claims it by itself on the first launch.
  // iPhone/iPad: the App Store passes nothing on, so with a code the page stays: the player
  //   copies the code and then goes to the App Store. Without a code: straight to the store.
  // Computers: both store buttons below (and the code, if there is one).
  (function () {
    var appStore = "https://apps.apple.com/app/id6798685894";
    var referrer = "utm_source=friend_share&utm_medium=share&utm_campaign=invite";
    var code = null;
    try {
      var raw = (new URLSearchParams(window.location.search).get("code") || "")
        .toUpperCase().replace(/[^A-Z0-9]/g, "");
      // 8 characters, no I, L, O, 0 or 1 (the game's alphabet)
      if (/^[A-HJKMNP-Z2-9]{8}$/.test(raw)) { code = raw; }
    } catch (e) { code = null; }
    if (code) { referrer += "&ref=" + code; }
    var googlePlay = "https://play.google.com/store/apps/details?id=com.StaramanGamesStudios.CaramelCrushers"
      + "&referrer=" + encodeURIComponent(referrer);
    window.caramelInvite = { code: code, appStore: appStore, googlePlay: googlePlay };

    var ua = navigator.userAgent || "";
    var isIos = /iPhone|iPad|iPod/i.test(ua)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPad in desktop mode
    var isAndroid = /Android/i.test(ua);
    window.caramelInvite.isIos = isIos;
    if (isAndroid) {
      window.location.replace(googlePlay);
    } else if (isIos && !code) {
      window.location.replace(appStore);
    }
  })();
</script>

    <h1>Caramel Crushers</h1>
    <p>A sweet match-3 puzzle game.<br>Free to play!</p>

    <section class="invite" id="invite">
      <p class="label">Your friend's invite code</p>
      <div class="code" id="code"></div>
      <p class="how">In the game, tap <b>SHARE</b> on the map and paste the code.</p>
      <button class="copy" id="copy" type="button">Copy code &amp; get the game</button>
      <p class="copied" id="copied" aria-live="polite"></p>
    </section>

    <div class="stores" id="stores">
      <a class="store" id="appstore" href="https://apps.apple.com/app/id6798685894">
        <small>Download on the</small>App Store
      </a>
      <a class="store" id="googleplay" href="https://play.google.com/store/apps/details?id=com.StaramanGamesStudios.CaramelCrushers&amp;referrer=utm_source%3Dfriend_share%26utm_medium%3Dshare%26utm_campaign%3Dinvite">
        <small>Get it on</small>Google Play
      </a>
    </div>
  </main>

  <script>
    (function () {
      var invite = window.caramelInvite || {};
      document.getElementById("googleplay").href = invite.googlePlay || document.getElementById("googleplay").href;
      if (!invite.code) {
        return;
      }
      document.getElementById("invite").className = "invite on";
      document.getElementById("code").textContent = invite.code;
      if (!invite.isIos) {
        return;
      }
      // iPhone/iPad: one button copies the code, then opens the App Store.
      document.getElementById("stores").className = "stores off";
      var button = document.getElementById("copy");
      var note = document.getElementById("copied");
      button.className = "copy on";
      button.addEventListener("click", function () {
        var copied = false;
        try {
          var field = document.createElement("textarea");
          field.value = invite.code;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          field.setSelectionRange(0, invite.code.length);
          copied = document.execCommand("copy");
          document.body.removeChild(field);
        } catch (e) { copied = false; }
        if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(invite.code).catch(function () {});
        }
        note.textContent = "Code copied! Opening the App Store...";
        setTimeout(function () { window.location.href = invite.appStore; }, 600);
      });
    })();
  </script>
